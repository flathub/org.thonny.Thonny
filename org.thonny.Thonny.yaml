id: org.thonny.Thonny
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: thonny.sh
cleanup:
  - /man
  - /share/man
finish-args:
  # Thonny requires access to serial / USB devices for embedded development.
  - --device=all

  - --filesystem=/media
  - --filesystem=/run/media

  # todo Remove filesystem=home permissions when it's possible to open directories with the native file chooser dialog.
  - --filesystem=home

  - --share=ipc
  - --share=network
  - --socket=x11
  - --system-talk-name=org.freedesktop.UDisks2
modules:
  # The `tkinter` module is missing from the Freedesktop Sdk's Python installation.
  # Be sure to use the same version of Python that's in the org.freedesktop.Sdk.
  # Update when updating runtime-version.
  - name: tkinter
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} . --no-build-isolation
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz
        sha256: 3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81
      - type: file
        path: python-tkinter-setup.py
        dest-filename: setup.py
    modules:
      - name: tcl
        buildsystem: autotools
        subdir: unix
        build-options:
          # Prevents linker crash when running bootstrap tclsh during build
          prepend-ld-library-path: /run/build/tcl/unix
        config-opts:
          # Installs libraries as physical files so tkinter can find them
          - --disable-zipfs
        cleanup:
          - /bin
          - /lib/pkgconfig
          - /man
        sources:
          - type: archive
            url: https://sourceforge.net/projects/tcl/files/Tcl/9.0.4/tcl9.0.4-src.tar.gz
            sha256: d0aed49230bc02a65c1e0229e65f34590a4b037ec40d546f32573b467f7551ea
            x-checker-data:
              type: html
              url: https://sourceforge.net/projects/tcl/rss
              pattern: <link>(https://sourceforge.net/.+/tcl(9\.0\.[\d\.]*\d)-src.tar.gz)/download
      - name: tk
        buildsystem: autotools
        subdir: unix
        config-opts:
          # Installs libraries as physical files so tkinter can find them
          - --disable-zipfs
        cleanup:
          - /bin
          - /lib/pkgconfig
          - /man
        sources:
          - type: archive
            url: https://sourceforge.net/projects/tcl/files/Tcl/9.0.4/tk9.0.4-src.tar.gz
            sha256: d7a146d2917eb8b5cc95276dbf0e3d03c7464d2b19c1675357857c989301dbb4
            x-checker-data:
              type: html
              url: https://sourceforge.net/projects/tcl/rss
              pattern: <link>(https://sourceforge.net/.+/tk(9\.0\.[\d\.]*\d)-src.tar.gz)/download

  # Add back the Turtle Python module which is stripped out of the org.freedesktop.Sdk.
  # Be sure to use the same version of Python that's in the org.freedesktop.Sdk.
  # Update when updating runtime-version.
  - name: python3-turtle
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} . --no-build-isolation
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz
        sha256: 3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81
      - type: file
        path: python-turtle-setup.py
        dest-filename: setup.py

  # Python dependencies required to build things
  - name: python3-setuptools-rust
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "setuptools-rust" --no-build-isolation
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/6a/23/8146aad7d88f4fcb3a6218f41a60f6c2d4e3a72de72da1825dc7c8f7877c/semantic_version-2.10.0-py2.py3-none-any.whl
        sha256: de78a3b8e0feda74cabc54aab2da702113e33ac9d9eb9d2389bcf1f58b7d9177
        x-checker-data:
          type: pypi
          name: semantic_version
          packagetype: bdist_wheel
      - type: file
        url: https://files.pythonhosted.org/packages/0b/80/909e46e684e47b116ed145bf2a1a8f5f7c9d90e8c3f8f7fce6a529c0068d/setuptools_rust-1.13.0-py3-none-any.whl
        sha256: 666439c4d90e968bb625bcf87ec0aa02b4f49e599d2f5dc255c633a04e8eca99
        x-checker-data:
          type: pypi
          name: setuptools-rust
          packagetype: bdist_wheel
  - name: python3-packaging
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "packaging" --no-build-isolation
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/63/34/ba1c580383c9eada3711951fef0795c80b829a078d72188184bcab9dd527/packaging-26.3-py3-none-any.whl
        sha256: d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
        x-checker-data:
          type: pypi
          name: packaging
          packagetype: bdist_wheel

  # The maturin Python library is handled specially since it has Rust code and dependencies.
  - name: python3-maturin
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/python3-maturin/cargo
        CARGO_NET_OFFLINE: 'true'
        RUST_BACKTRACE: '1'
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "maturin" --no-build-isolation
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b9/c8/22e5e21b2679c9bce6415ca578034ca2cc9316be0642ae21e051a2d5198c/maturin-1.15.0.tar.gz
        sha256: 94b26cc8e8aba61a5f2099715fe640e18c5f678e9a500408b38761263954228a
      # The Cargo sources should be updated whenever maturin is updated.
      - maturin-cargo-sources.json

  # The uv-build Python library is handled specially since it has Rust code and dependencies.
  - name: python3-uv-build
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/python3-uv-build/cargo
        CARGO_NET_OFFLINE: 'true'
        RUST_BACKTRACE: '1'
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "uv-build" --no-build-isolation
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/18/db/8f80e3383a93a72317d06eb4afc89cd111d6ff30d25fd1d65150aba284be/uv_build-0.13.1.tar.gz
        sha256: ae57a8f25fd5da6bfb33be95d6687db6b3e774a895b78a04dec8d5e2c77fcc95
      # The Cargo sources should be updated whenever uv-build is updated.
      - uv-cargo-sources.json
          
  # The cryptography Python library is handled specially since it has Rust code and dependencies.
  - name: python3-cryptography
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/python3-cryptography/cargo
        CARGO_NET_OFFLINE: 'true'
        RUST_BACKTRACE: '1'
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "cryptography" --no-build-isolation --no-binary cryptography
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/9d/af/182eb91b0df3fe75c4d9f26fe70684569566745f6ba7e5c9c73a862c5252/cryptography-50.0.2.tar.gz
        sha256: 7b46165bb56eb4704e2eaaf86f3c940d19154535d9b0ca7d6d590b04060e00d5
      # The Cargo sources should be updated whenever cryptography is updated.
      - cryptography-cargo-sources.json
    modules:
      - name: python3-cffi
        buildsystem: simple
        build-commands:
          - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
            --prefix=${FLATPAK_DEST} "cffi" --no-build-isolation
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/9e/ef/008a1939e372c06329a3fce4279c02f328488f3526744906eeec3da7ad5f/cffi-2.1.1.tar.gz
            sha256: dd31f52ea1086513bb9df30f8fcee9b8918323ae067a3d5b78bc826a000712be
            x-checker-data:
              type: pypi
              name: cffi
          - type: file
            url: https://files.pythonhosted.org/packages/90/11/0e6f11117525ff0eec40ebac3d313376f102df93ca44ad9e893ee85e4f89/pycparser-3.11-py3-none-any.whl
            sha256: 51d5a8ba2be0bbe440b99d2112604c95bbbc3c2748a64260186c541e1729cd80
            x-checker-data:
              type: pypi
              name: pycparser
              packagetype: bdist_wheel

  # The bcrypt Python library is handled specially since it has Rust code and dependencies.
  - name: python3-bcrypt
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/python3-bcrypt/cargo
        CARGO_NET_OFFLINE: 'true'
        RUST_BACKTRACE: '1'
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "bcrypt" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/8c/ae/3af7d006aacf513975fd1948a6b4d6f8b4a307f8a244e1a3d3774b297aad/bcrypt-4.0.1.tar.gz
        sha256: 27d375903ac8261cfe4047f6709d16f7d18d39b1ec92aaf72af989552a650ebd
      # The Cargo sources should be updated whenever bcrypt is updated.
      - bcrypt-cargo-sources.json

  # The tibs Python library is handled specially since it has Rust code and dependencies.
  - name: python3-tibs
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/python3-tibs/cargo
        CARGO_NET_OFFLINE: 'true'
        RUST_BACKTRACE: '1'
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "tibs" --no-build-isolation --no-binary cryptography
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/9f/4e/731ae9c3ccc0e65363a4ce411cb8d887e07fa0cb6a3a860b8ce0c57483dd/tibs-2.0.2.tar.gz
        sha256: 63a7b87e262c558ccc16be67d34fe60620e39b49bf644ac65e71c4553173ac8f
        x-checker-data:
          type: pypi
          name: tibs
      # The Cargo sources should be updated whenever tibs is updated.
      - tibs-cargo-sources.json

  # Python dependencies
  - bundled-python-modules.json

  - name: thonny
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} . --no-build-isolation
      - install -Dm644 packaging/linux/org.thonny.Thonny.desktop -t ${FLATPAK_DEST}/share/applications
      - sed -i 's/Icon=thonny/Icon=org.thonny.Thonny/' ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - sed -i 's|Exec=/usr/bin/thonny|Exec=thonny|g' ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - for size in 16x16 22x22 32x32 48x48 64x64 128x128 192x192 256x256; do install
        -Dm644 -T packaging/icons/thonny-$size.png ${FLATPAK_DEST}/share/icons/hicolor/$size/apps/${FLATPAK_ID}.png;
        done
      - install -Dm644 packaging/linux/org.thonny.Thonny.appdata.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.appdata.xml
      - install -Dm 755 -t /app/bin/ thonny.sh
    sources:
      - thonny-sources.yaml
      - type: patch
        path: 0001-Update-appstream-metadata-3098.patch
      - type: patch
        path: 0002-Create-venv-and-install-pip-in-venv-as-separate-step.patch
      - type: script
        dest-filename: thonny.sh
        commands:
          # Set PYTHONUSERBASE to be under the ~/.var/app/org.thonny.Thonny/data directory.
          - export PYTHONUSERBASE=$XDG_DATA_HOME
          - /app/bin/thonny "$@"
